<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <!-- Week1: header/main/footer 시맨틱 구조 -->
  <header>
    <h1>할 일 목록</h1>
    <!-- Week3: aria-live로 스크린리더에 실시간 알림 -->
    <output id="count" aria-live="polite">0개 남음</output>
  </header>

  <main>

    <!-- 입력 섹션 -->
    <section class="input-section" aria-label="할 일 추가">
      <!-- Week3: 속성 선택자로 스타일 적용 가능한 type 속성 -->
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요" aria-label="할 일 입력">
      <button type="button" id="add-btn" aria-label="추가">추가</button>
    </section>

    <!-- 필터 섹션: Week3의 data-* 속성 패턴 -->
    <section class="filter-section" aria-label="필터">
      <button type="button" class="filter-btn active" data-filter="all">전체</button>
      <button type="button" class="filter-btn" data-filter="active">진행 중</button>
      <button type="button" class="filter-btn" data-filter="done">완료</button>
    </section>

    <!-- 목록 섹션 -->
    <section class="list-section" aria-label="할 일 목록">
      <!-- Week3: aria-label, role 속성 -->
      <ul id="todo-list" role="list"></ul>
      <p id="empty-message" role="status">할 일이 없습니다.</p>
    </section>

  </main>

  <footer>
    <p>Week 1~3 개념 실습 프로젝트</p>
  </footer>

</body>
</html>
